name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install canvas system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Smoke test daily report image
        run: node scripts/smoke-report.js

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-smoke
          path: daily-report.png
          if-no-files-found: error
